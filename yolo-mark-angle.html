<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOLO OBB 四点标注工具</title>
    <style>
        body { margin:0; font-family:sans-serif; }
        #toolbar { padding:10px; background:#eee; }
        canvas { border:1px solid #333; display:block; margin:10px auto; cursor:crosshair; }
    </style>
</head>
<body>

<div id="toolbar">
    <input type="file" id="imgLoader" multiple>
    <button id="prev">上一张</button>
    <button id="next">下一张</button>
    <button id="save">保存标注(.txt)</button>
    <span id="info"></span>
</div>
<canvas id="canvas" width="800" height="600"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const imgLoader = document.getElementById('imgLoader');
  const info = document.getElementById('info');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const saveBtn = document.getElementById('save');

  let images=[], imgFiles=[], imgIndex=0, img=new Image();
  let annotations={}; // {filename:[{cls,x,y,w,h,angle}]}
  let dragging=false, startX=0, startY=0, currentBox=null;
  let selectedBox=null;

  // 旋转矩形类
  class OBB {
    constructor(x,y,w,h,angle=0){
      this.x=x; this.y=y; this.w=w; this.h=h; this.angle=angle;
      this.cls=0; // 默认class=0
    }
    draw(ctx, selected=false){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.rotate(this.angle);
      ctx.strokeStyle = selected ? "blue" : "red";
      ctx.lineWidth = selected ? 3 : 2;
      ctx.strokeRect(-this.w/2,-this.h/2,this.w,this.h);
      // 角度指示线
      const len = this.h/2;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(0,-len);
      ctx.strokeStyle="green";
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.restore();
    }
    getCorners(){
      const cosA=Math.cos(this.angle), sinA=Math.sin(this.angle);
      const dx=this.w/2, dy=this.h/2;
      const corners=[
        {x:-dx,y:-dy},
        {x:dx,y:-dy},
        {x:dx,y:dy},
        {x:-dx,y:dy}
      ];
      return corners.map(p=>{
        return {
          X:this.x + p.x * cosA - p.y * sinA,
          Y:this.y + p.x * sinA + p.y * cosA
        }
      });
    }
  }

  // 绘制
  let mouseX=0, mouseY=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const anns = annotations[images[imgIndex]] || [];
    for(const box of anns) box.draw(ctx, box===selectedBox);
    if(currentBox) currentBox.draw(ctx,true);
    // 辅助线
    if(mouseX && mouseY){
      ctx.strokeStyle='green';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(mouseX,0); ctx.lineTo(mouseX,canvas.height);
      ctx.moveTo(0,mouseY); ctx.lineTo(canvas.width,mouseY);
      ctx.stroke();
    }
  }

  // 鼠标事件
  canvas.addEventListener('mousemove', e=>{
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    if(dragging){
      const mx = mouseX;
      const my = mouseY;
      const w = Math.abs(mx-startX);
      const h = Math.abs(my-startY);
      const x = (startX+mx)/2;
      const y = (startY+my)/2;
      currentBox.x=x; currentBox.y=y; currentBox.w=w; currentBox.h=h;
    }
    draw();
  });

  canvas.addEventListener('mousedown', e=>{
    dragging=true;
    startX=mouseX;
    startY=mouseY;
    selectedBox=null;
    const anns = annotations[images[imgIndex]] || [];
    for(let box of anns){
      const dx = mouseX - box.x;
      const dy = mouseY - box.y;
      const cosA=Math.cos(-box.angle), sinA=Math.sin(-box.angle);
      const lx=dx*cosA - dy*sinA;
      const ly=dx*sinA + dy*cosA;
      if(lx>=-box.w/2 && lx<=box.w/2 && ly>=-box.h/2 && ly<=box.h/2){
        selectedBox=box;
        dragging=false;
        draw();
        return;
      }
    }
    currentBox=new OBB(startX,startY,0,0,0);
  });

  canvas.addEventListener('mouseup', e=>{
    if(currentBox){
      dragging=false;
      if(!annotations[images[imgIndex]]) annotations[images[imgIndex]]=[];
      annotations[images[imgIndex]].push(currentBox);
      currentBox=null;
    }
    draw();
  });

  // 旋转选中框
  window.addEventListener('keydown', e=>{
    if(!selectedBox) return;
    if(e.key==='q') selectedBox.angle-=0.1;
    if(e.key==='e') selectedBox.angle+=0.1;
    draw();
  });

  // 加载图片
  imgLoader.addEventListener('change', e=>{
    imgFiles = Array.from(e.target.files);
    images = imgFiles.map(f=>f.name);
    imgIndex=0;
    loadImage();
  });

  function loadImage(){
    const file = imgFiles[imgIndex];
    const reader = new FileReader();
    reader.onload=ev=>{
      img.src=ev.target.result;
      img.onload=draw;
      info.textContent=`图片: ${images[imgIndex]} (${imgIndex+1}/${images.length})`;
    };
    reader.readAsDataURL(file);
  }

  // 上一张/下一张
  prevBtn.addEventListener('click', ()=>{ if(imgIndex>0){ imgIndex--; selectedBox=null; loadImage(); }});
  nextBtn.addEventListener('click', ()=>{ if(imgIndex<images.length-1){ imgIndex++; selectedBox=null; loadImage(); }});

  // 保存为四点归一化 txt
  saveBtn.addEventListener('click', ()=>{
    const canvasW=canvas.width;
    const canvasH=canvas.height;
    for(const [fname, boxes] of Object.entries(annotations)){
      const lines=boxes.map(b=>{
        const pts = b.getCorners();
        const coords = pts.map(p=>[(p.X/canvasW).toFixed(6),(p.Y/canvasH).toFixed(6)]).flat();
        return [b.cls, ...coords].join(' ');
      });
      const dataStr="data:text/plain;charset=utf-8,"+encodeURIComponent(lines.join("\n"));
      const dlAnchor=document.createElement('a');
      dlAnchor.setAttribute("href",dataStr);
      dlAnchor.setAttribute("download", fname.replace(/\.[^.]+$/,".txt"));
      dlAnchor.click();
    }
    alert("✅ 标注已保存为 YOLO OBB 四点归一化 txt");
  });
</script>
</body>
</html>
