<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>YOLO OBB 多框标注工具（带辅助线）</title>
    <style>
        body { margin:0; background:#111; color:#eee; font-family:Arial, sans-serif; }
        #bar { padding:8px; background:#222; display:flex; gap:10px; align-items:center; }
        canvas { display:block; background:#000; cursor:crosshair; }
        input { width:60px; }
        .hint { color:#aaa; font-size:12px; }
    </style>
</head>
<body>

<div id="bar">
    <input type="file" id="fileInput" />
    <span>class</span><input id="cls" value="0" />
    <button onclick="exportLabel()">导出 OBB</button>
    <span id="info" class="hint"></span>
</div>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const info = document.getElementById('info');

  let img = new Image();
  let imageFileName = '';
  let start = null;
  let boxes = [];
  let activeBoxIndex = -1;
  let mousePos = null;
  const STEP = 5 * Math.PI / 180;

  fileInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    imageFileName = file.name.replace(/\.[^/.]+$/, '');
    img.src = URL.createObjectURL(file);
  };

  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    boxes = [];
    activeBoxIndex = -1;
    draw();
  };

  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x:e.clientX-r.left, y:e.clientY-r.top };
  }

  canvas.onmousemove = e => {
    mousePos = getPos(e);
    if (start) {
      const p = mousePos;
      const cx = (start.x + p.x)/2;
      const cy = (start.y + p.y)/2;
      const w = Math.abs(p.x - start.x);
      const h = Math.abs(p.y - start.y);
      const angle = 0;
      const box = {cx, cy, w, h, angle};

      if (activeBoxIndex === -1) {
        if (boxes.length === 0 || boxes[boxes.length-1].angle !== undefined) {
          boxes.push(box);
          activeBoxIndex = boxes.length-1;
        } else {
          boxes[boxes.length-1] = box;
        }
      } else {
        boxes[activeBoxIndex].cx = cx;
        boxes[activeBoxIndex].cy = cy;
        boxes[activeBoxIndex].w = w;
        boxes[activeBoxIndex].h = h;
      }
    }
    draw();
  };

  canvas.onmousedown = e => {
    const p = getPos(e);
    activeBoxIndex = -1;
    for (let i = boxes.length-1; i>=0; i--) {
      const b = boxes[i];
      const dx = p.x - b.cx;
      const dy = p.y - b.cy;
      if (Math.abs(dx)<=b.w/2 && Math.abs(dy)<=b.h/2){
        activeBoxIndex=i;
        draw();
        return;
      }
    }
    start = p;
  };

  canvas.onmouseup = e => start=null;

  window.onkeydown = e => {
    if (activeBoxIndex === -1) return;
    let step = e.shiftKey ? STEP*3 : STEP;
    if (e.key==='q' || e.key==='Q') boxes[activeBoxIndex].angle -= step;
    if (e.key==='e' || e.key==='E') boxes[activeBoxIndex].angle += step;
    draw();
  };

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);

    // 绘制已有框
    boxes.forEach((b,i)=>{
      ctx.save();
      ctx.translate(b.cx,b.cy);
      ctx.rotate(b.angle);
      ctx.strokeStyle=(i===activeBoxIndex)?'lime':'yellow';
      ctx.lineWidth=2;
      ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(b.w/2,0);
      ctx.strokeStyle='red';
      ctx.stroke();
      ctx.restore();
    });

    // 鼠标辅助线
    if (mousePos){
      ctx.strokeStyle='rgba(255,255,255,0.3)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(mousePos.x,0);
      ctx.lineTo(mousePos.x,canvas.height);
      ctx.moveTo(0,mousePos.y);
      ctx.lineTo(canvas.width,mousePos.y);
      ctx.stroke();
    }

    info.innerText='拖拽画框，点击选择，Q/E旋转，Shift加速';
  }

  function exportLabel(){
    if (boxes.length===0){alert('未标注');return;}
    const cls=document.getElementById('cls').value;
    let lines = boxes.map(b=>{
      let w=b.w,h=b.h,a=b.angle;
      if(h>w){[w,h]=[h,w];a+=Math.PI/2;}
      while(a>=Math.PI/2)a-=Math.PI;
      while(a<-Math.PI/2)a+=Math.PI;
      const x=b.cx/canvas.width;
      const y=b.cy/canvas.height;
      const wn=w/canvas.width;
      const hn=h/canvas.height;
      return `${cls} ${x.toFixed(6)} ${y.toFixed(6)} ${wn.toFixed(6)} ${hn.toFixed(6)} ${a.toFixed(6)}`;
    });
    const blob=new Blob([lines.join('\n')],{type:'text/plain'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download = imageFileName ? `${imageFileName}.txt` : 'labels.txt';
    link.click();
  }
</script>

</body>
</html>
