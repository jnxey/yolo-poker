<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OBB 四点标注工具（ES5 兼容版 + 角度辅助线）</title>
    <style>
        body { margin:0; background:#222; color:#eee; font-family:Arial }
        #toolbar { padding:8px; background:#333; display:flex; gap:10px; align-items:center }
        canvas { display:block; margin:auto; background:#000; cursor:crosshair }
        button { padding:6px 12px }
    </style>
</head>
<body>
<div id="toolbar">
    <input type="file" id="imgInput" />
    <button onclick="exportLabels()">导出标签</button>
    <span>拖拽创建 | 点击选中 | 拖角点 | Q/E 旋转</span>
</div>
<canvas id="c"></canvas>
<script>
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var img = new Image();
  var boxes = [];
  var current = null;
  var dragging = false;
  var start = null;
  var selected = null;
  var draggingPoint = null;
  var mousePos = null;

  function OBB(x1,y1,x2,y2){
    this.cls = 0;
    this.points = [
      {x:x1,y:y1},
      {x:x2,y:y1},
      {x:x2,y:y2},
      {x:x1,y:y2}
    ];
  }
  OBB.prototype.center = function(){
    var cx=0, cy=0;
    for(var i=0;i<4;i++){ cx+=this.points[i].x; cy+=this.points[i].y; }
    return {x:cx/4, y:cy/4};
  };
  OBB.prototype.rotate = function(a){
    var c = this.center();
    var cos = Math.cos(a), sin = Math.sin(a);
    for(var i=0;i<4;i++){
      var dx = this.points[i].x - c.x;
      var dy = this.points[i].y - c.y;
      this.points[i].x = c.x + dx*cos - dy*sin;
      this.points[i].y = c.y + dx*sin + dy*cos;
    }
  };
  OBB.prototype.draw = function(sel){
    // 框
    ctx.beginPath();
    ctx.moveTo(this.points[0].x,this.points[0].y);
    for(var i=1;i<4;i++) ctx.lineTo(this.points[i].x,this.points[i].y);
    ctx.closePath();
    ctx.strokeStyle = sel?'#00f':'#f00';
    ctx.lineWidth = sel?3:2;
    ctx.stroke();

    // 角点
    if(sel){
      ctx.fillStyle='#0f0';
      for(var i=0;i<4;i++){
        ctx.beginPath();
        ctx.arc(this.points[i].x,this.points[i].y,5,0,Math.PI*2);
        ctx.fill();
      }
    }

    // 角度辅助线（主轴）
    var c = this.center();
    var mx = (this.points[0].x + this.points[1].x)/2;
    var my = (this.points[0].y + this.points[1].y)/2;
    ctx.save();
    ctx.strokeStyle='yellow';
    ctx.lineWidth=2;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(c.x,c.y);
    ctx.lineTo(mx,my);
    ctx.stroke();
    ctx.restore();
  };
  OBB.prototype.hit = function(x,y){
    var inside=false;
    for(var i=0,j=3;i<4;j=i++){
      var xi=this.points[i].x, yi=this.points[i].y;
      var xj=this.points[j].x, yj=this.points[j].y;
      var intersect = ((yi>y)!=(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi);
      if(intersect) inside = !inside;
    }
    return inside;
  };
  OBB.prototype.hitPoint = function(x,y){
    for(var i=0;i<4;i++){
      var p=this.points[i];
      if(Math.sqrt((p.x-x)*(p.x-x)+(p.y-y)*(p.y-y))<8) return i;
    }
    return -1;
  };

  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);

    // 鼠标十字辅助线
    if(mousePos){
      ctx.save();
      ctx.strokeStyle='rgba(0,255,255,0.6)';
      ctx.lineWidth=1;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(mousePos.x,0);
      ctx.lineTo(mousePos.x,canvas.height);
      ctx.moveTo(0,mousePos.y);
      ctx.lineTo(canvas.width,mousePos.y);
      ctx.stroke();
      ctx.restore();
    }

    for(var i=0;i<boxes.length;i++) boxes[i].draw(boxes[i]===selected);
  }

  document.getElementById('imgInput').onchange = function(e){
    var f = e.target.files[0];
    img.onload=function(){
      canvas.width = img.width;
      canvas.height = img.height;
      boxes=[];
      redraw();
    };
    img.src = URL.createObjectURL(f);
  };

  canvas.onmousedown = function(e){
    var r=canvas.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    draggingPoint=null;
    for(var i=0;i<boxes.length;i++){
      var idx = boxes[i].hitPoint(x,y);
      if(idx>=0){ selected=boxes[i]; draggingPoint=idx; redraw(); return; }
    }
    selected=null;
    for(var i=0;i<boxes.length;i++) if(boxes[i].hit(x,y)) selected=boxes[i];
    if(selected){ redraw(); return; }
    start={x:x, y:y};
    dragging=true;
  };

  canvas.onmousemove = function(e){
    var r=canvas.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    mousePos={x:x,y:y};

    if(draggingPoint!==null && selected){
      selected.points[draggingPoint]={x:x,y:y};
      redraw(); return;
    }
    if(!dragging){ redraw(); return; }
    current=new OBB(start.x,start.y,x,y);
    redraw(); current.draw(true);
  };

  canvas.onmouseup = function(e){
    if(dragging && current){ boxes.push(current); }
    dragging=false; draggingPoint=null; current=null;
    redraw();
  };

  window.onkeydown=function(e){
    if(!selected) return;
    if(e.key==='q') selected.rotate(-0.05);
    if(e.key==='e') selected.rotate(0.05);
    redraw();
  };

  function exportLabels(){
    var lines = boxes.map(function(b){
      var arr = [b.cls];
      for(var i=0;i<4;i++){
        arr.push((b.points[i].x/canvas.width).toFixed(6));
        arr.push((b.points[i].y/canvas.height).toFixed(6));
      }
      return arr.join(' ');
    });
    var blob = new Blob([lines.join('\n')],{type:'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='labels.txt';
    a.click();
  }
</script>
</body>
</html>
